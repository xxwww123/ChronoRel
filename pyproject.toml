[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronorel-components"
version = "0.1.0"
description = "Observation-guided diffusion adapters for bronze ornament inpainting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1.2,<3"]

[tool.setuptools.packages.find]
include = ["chronorel*"]
